name: Deploy 0.2.0dev to GitHub Pages

on:
  push:
    branches: [0.2.0dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the stable site
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Check out the 0.2.0dev site
        uses: actions/checkout@v4
        with:
          ref: 0.2.0dev
          path: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: |
            stable/package-lock.json
            dev/package-lock.json

      - name: Build the stable v0.1.1 site
        working-directory: stable
        run: |
          npm ci
          npm run build
          npm run build-storybook

      - name: Verify and build 0.2.0dev
        working-directory: dev
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run build-storybook

      - name: Assemble stable and experimental sites
        run: |
          mkdir -p pages-output/storybook
          cp -R stable/dist/. pages-output/
          cp -R stable/storybook-static/. pages-output/storybook/
          mkdir -p pages-output/0.2.0dev/storybook
          cp -R dev/dist/. pages-output/0.2.0dev/
          cp -R dev/storybook-static/. pages-output/0.2.0dev/storybook/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
